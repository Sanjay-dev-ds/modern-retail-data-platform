retail:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: RETAIL_SVC
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      role: RETAIL_ROLE
      warehouse: RETAIL_WH
      database: RETAIL
      schema: STAGING
      threads: 4
