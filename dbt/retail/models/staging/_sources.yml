version: 2

sources:
  - name: raw
    description: >
      Landing tables loaded hourly by Airflow (COPY INTO from S3). POS and clickstream rows are
      whole records in `record` (VARIANT); `_file` is the S3 file, `_loaded_at` the load time.
    database: RETAIL
    schema: RAW
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 12, period: hour}
    tables:
      - name: pos_stores
        description: DMS full load + CDC of pos.stores. record has Op (I/U/D) and _dms_commit_ts.
      - name: pos_customers
        description: DMS full load + CDC of pos.customers.
      - name: pos_transactions
        description: DMS full load + CDC of pos.transactions (order headers).
      - name: pos_transaction_lines
        description: DMS full load + CDC of pos.transaction_lines (one product per sale).
      - name: pos_payments
        description: DMS full load + CDC of pos.payments (tenders; split payments = several rows).
      - name: clickstream_events
        description: Web/app events from Kinesis Firehose. At-least-once, so duplicates exist.
      - name: catalog_products
        description: Supplier's daily full catalog snapshot (CSV, loaded by column name).
        config:
          freshness:  # one file per day
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
