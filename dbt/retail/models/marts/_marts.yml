version: 2

models:
  - name: mart_daily_sales
    description: |
      Daily sales for BI dashboards.

      - **Grain:** one row per day × store × channel.
      - **Primary key:** `txn_date`, `store_id`, `channel`.
      - **Source:** `fct_sales_lines` (deleted sales excluded) + current `dim_store`.
      - **Refresh:** full rebuild each run.
    config:
      meta: {grain: "day x store x channel", primary_key: "txn_date, store_id, channel", layer: marts}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [txn_date, store_id, channel]
    columns:
      - name: txn_date
        description: Sales date.
      - name: store_id
        description: "{{ doc('col_store_id') }}"
      - name: store_name
        description: Current store name.
      - name: region
        description: Current store region.
      - name: channel
        description: "{{ doc('col_channel') }}"
      - name: completed_orders
        description: Number of completed sales (distinct transactions).
      - name: units_sold
        description: Units on completed sales.
      - name: net_revenue
        description: Sum of net_amount on completed sales (after line discounts).
      - name: discounts
        description: Sum of line discounts on completed sales.
      - name: voided_orders
        description: Number of sales voided at the till.
      - name: returned_orders
        description: Number of sales returned later.
      - name: returned_amount
        description: Net amount of the returned sales.

  - name: mart_web_funnel
    description: |
      Daily web / app funnel and conversion.

      - **Grain:** one row per day (session start date).
      - **Primary key:** `session_date`.
      - **Source:** `fct_sessions`.
      - **Refresh:** full rebuild each run.
    config:
      meta: {grain: "day", primary_key: "session_date", layer: marts}
    columns:
      - name: session_date
        description: Date the sessions started.
        data_tests: [unique, not_null]
      - name: sessions
        description: Number of sessions.
      - name: viewed_product
        description: Sessions that reached a product page.
      - name: added_to_cart
        description: Sessions that added to the cart.
      - name: started_checkout
        description: Sessions that started checkout.
      - name: purchased
        description: Sessions that purchased.
      - name: conversion_rate
        description: purchased / sessions.
