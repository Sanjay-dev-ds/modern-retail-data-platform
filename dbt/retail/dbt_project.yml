# Retail dbt project: RAW (COPY INTO) -> STAGING (views) -> CORE (dims/facts) -> MARTS.
# Run by Airflow through Cosmos (airflow/dags/retail_elt.py); profile "retail" is generated by
# Cosmos from the snowflake_default connection, so there is no profiles.yml in the repo.
name: retail
version: "1.0.0"
profile: retail

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental models reprocess rows loaded within this window before the last run's watermark.
  sales_lookback_hours: 1
  clickstream_lookback_hours: 6   # late clickstream events arrive up to ~6 h after event_ts

models:
  retail:
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
