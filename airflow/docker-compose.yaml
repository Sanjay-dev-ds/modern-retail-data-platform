# Airflow 3 on the platform EC2 host (LocalExecutor + Postgres metadata DB).
# Started by scripts/setup_host.sh with `docker compose up -d --build` (image: Dockerfile here,
# Airflow + Cosmos + dbt). ${VAR}s come from .env, a copy of
# /etc/retail/platform.env (non-secret settings written by Terraform).
# The Airflow keys and the metadata DB password below are fixed and public ON PURPOSE: this is
# an experimental project, the UI is only reachable through an SSM tunnel, and the metadata DB
# is not exposed outside Docker. Only the POS DB credentials are kept in Secrets Manager.
# AWS access : the EC2 instance role via IMDS (instance metadata hop limit is 2 for containers).
# UI         : 127.0.0.1:8080 on the host -> `make airflow-ui` from your machine.

x-airflow-common: &airflow-common
  image: retail-airflow:${AIRFLOW_VERSION:-3.3.2}
  build:
    context: .
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.2}
  user: "50000:0"
  environment:
    AIRFLOW__CORE__FERNET_KEY: RGYpkdrUYunIiL1Ju7ddUmZUO2anmWgjTat5bZ-dDJU=
    AIRFLOW__API__SECRET_KEY: retail-dev-api-secret-key
    AIRFLOW__API_AUTH__JWT_SECRET: retail-dev-jwt-secret-change-me-if-this-ever-goes-public-facing
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # No login: the UI is only reachable through the SSM tunnel on localhost.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Connections from Secrets Manager: <prefix>/connections/pos_db, .../snowflake_default.
    # Variables are not looked up there (Cosmos caches in Variables; avoids an API call each parse).
    AIRFLOW__SECRETS__BACKEND: airflow.providers.amazon.aws.secrets.secrets_manager.SecretsManagerBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"connections_prefix": "${SECRETS_PREFIX}/connections", "variables_prefix": null}'
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    # Platform values as Airflow Variables: Variable.get("raw_bucket"), ...
    AIRFLOW_VAR_RAW_BUCKET: ${RAW_BUCKET}
    AIRFLOW_VAR_KINESIS_STREAM: ${KINESIS_STREAM}
    AIRFLOW_VAR_DMS_TASK_ARN: ${DMS_TASK_ARN}
    AIRFLOW_VAR_GLUE_CRAWLER: ${GLUE_CRAWLER}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../dbt:/opt/airflow/dbt:ro   # Cosmos runs dbt in a temp copy, so read-only is enough
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
