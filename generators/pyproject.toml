[project]
name = "retail-gen"
version = "0.1.0"
description = "Synthetic retail source data: POS database (RDS), clickstream (Kinesis), catalog files (S3)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
    "Faker>=25.0",
    "PyYAML>=6.0",
]

[project.scripts]
retail-gen = "retail_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_gen"]
